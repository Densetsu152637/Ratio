name: Release

# Runs on every pushed version tag. A release is created only from a commit that is on main,
# whose CI run on main succeeded, and whose workspace version equals the tag; otherwise the run
# fails and nothing is published. The tags themselves are protected by a repository ruleset
# (CONTRIBUTING.md, "Releases").
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The workspace version equals the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "v$version" != "$TAG" ]; then
            echo "The tag is $TAG but the workspace version is $version." >&2
            exit 1
          fi
      - name: CI passed on main for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&status=success" --jq '.total_count')"
          if [ "$passed" -lt 1 ]; then
            echo "No successful CI run on main for $GITHUB_SHA." >&2
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$TAG"
