[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Densetsu152637/Ratio"

[workspace.dependencies]
ratio-syntax = { path = "crates/ratio-syntax", version = "0.1.0" }
ratio-names = { path = "crates/ratio-names", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
